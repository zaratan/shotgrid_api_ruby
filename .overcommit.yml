PreCommit:
  RuboCop:
    enabled: true
    command: ['bundle', 'exec', 'rubocop'] # Invoke within Bundler context
  BundleOutdated:
    enabled: true
  BundleAudit:
    enabled: true
  SyntaxTree:
    enabled: true
    required_executable: './bin/streerun'
  Sorbet:
    enabled: true
    required_executable: './bin/sorbet_check'
  Documentation:
    enabled: true
    required_executable: './bin/generate_and_add_documentation'
PrePush:
  RSpec:
    enabled: true
    command: ['bundle', 'exec', 'rspec', '-f', 'p'] # Invoke within Bundler context
  SyntaxTree:
    enabled: true
    required_executable: './bin/streerun'
  Rubocop:
    enabled: true
    required_executable: './bin/ruborun'
  Sorbet:
    enabled: true
    required_executable: './bin/sorbet_check'
