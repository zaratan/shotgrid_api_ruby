inherit_from:
  - http://relaxed.ruby.style/rubocop.yml

plugins:
  - rubocop-faker
  - rubocop-performance
  - rubocop-sorbet

# Layout and most Style cops are disabled because formatting is handled
# outside of RuboCop (historically by Prettier + Syntax Tree). RuboCop is
# kept for semantic/lint checks only.
Layout:
  Enabled: false

# Layout/LineLength is re-enabled because some Style cops (e.g.
# Style/IfUnlessModifier) rely on it to behave correctly.
Layout/LineLength:
  Enabled: true

Style/MultilineIfModifier:
  Enabled: false

Style/EmptyMethod:
  EnforcedStyle: expanded

Style/Lambda:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: false

Style/QuotedSymbols:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/WordArray:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

AllCops:
  NewCops: enable
  DisplayStyleGuide: true
  DisplayCopNames: true
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - 'bin/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'
    - 'Guardfile'
    - 'config/environments/*.rb'
    - 'lib/tasks/*.rake'
    - 'shotgun_api_ruby.gemspec'

### Prettier
Style:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

# `delete` and `revive` mirror Shotgrid's REST verbs; they are imperative
# actions that happen to return `true` on success, not predicates.
Naming/PredicateMethod:
  Exclude:
    - 'lib/shotgrid_api_ruby/entities.rb'

# Sorbet `sig` cannot reference an anonymous `&` block parameter, so the
# explicit `&block` form is required wherever a method has a Sorbet signature.
Naming/BlockForwarding:
  EnforcedStyle: explicit
